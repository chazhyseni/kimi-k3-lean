# Example litmoe models.yaml
# Copy to models.yaml and edit paths.

host: 127.0.0.1
port: 8080
api_key: null

models:
  # Small models: 256K context (KV cache is tiny — <4 GB even at 512K)
  - id: qwen3.8-9b-distill
    engine: llamacpp
    model_path: unsloth/Qwen3.8-9B-Distill-GGUF:Q4_K_M
    n_gpu_layers: -1
    n_ctx: 262144    # 256K — model supports 1M with YaRN

  - id: kimi-linear-48b
    engine: llamacpp
    model_path: mradermacher/Kimi-Linear-48B-A3B-Instruct-GGUF:Q4_K_M
    n_gpu_layers: -1
    n_ctx: 262144    # 256K — KDA attention uses tiny KV cache (~4 GB at 512K)

  # Large MoE: 64K context (83 GB model leaves little room for KV cache)
  - id: deepseek-v4-flash
    engine: llamacpp
    model_path: unsloth/DeepSeek-V4-Flash-0731-GGUF:UD-IQ1_S
    n_gpu_layers: -1
    n_ctx: 65536     # 64K — KV cache = 5.8 GB, model = 83 GB

  # Trillion-scale: 128K context (models support 256K-1M)
  # - id: kimi-k3
  #   engine: llamacpp
  #   model_path: unsloth/Kimi-K3-GGUF:UD-IQ1_S
  #   n_gpu_layers: -1
  #   n_ctx: 131072  # 128K