# Example litmoe models.yaml
# Copy to models.yaml and edit paths.

host: 127.0.0.1
port: 8080
api_key: null

models:
  # Kimi-K3 (2.78T, 93B active) via llama.cpp
  # IQ1_S = 594 GB. Needs ~594 GB RAM+VRAM combined.
  - id: kimi-k3
    engine: llamacpp
    model_path: unsloth/Kimi-K3-GGUF:UD-IQ1_S
    n_gpu_layers: -1
    n_ctx: 65536

  # Qwen3.8-2.4T (2.4T, 95B active) via llama.cpp
  # IQ1_S = 508 GB. Needs ~508 GB RAM+VRAM combined.
  - id: qwen3.8-2.4t
    engine: llamacpp
    model_path: unsloth/Qwen3.8-2.4T-A95B-GGUF:UD-IQ1_S
    n_gpu_layers: -1
    n_ctx: 65536

  # MiniMax-M3 (428B, 23B active) via llama.cpp
  # IQ1_M = 128 GB. Smallest viable trillion-scale MoE. Runs on 128 GB RAM.
  - id: minimax-m3
    engine: llamacpp
    model_path: unsloth/MiniMax-M3-GGUF:UD-IQ1_M
    n_gpu_layers: -1
    n_ctx: 65536

  # DeepSeek-V3 (671B, 37B active) via ktransformers
  # ktransformers has native AMX/AVX-512/CUDA optimization for this model.
  # Requires safetensors directory + GGUF for quantized experts.
  # - id: deepseek-v3
  #   engine: ktransformers
  #   model_path: /data/deepseek-v3
  #   n_gpu_layers: -1
  #   n_ctx: 65536