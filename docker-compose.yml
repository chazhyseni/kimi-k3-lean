# docker-compose.yml — bring up kimi-k3-lean with sensible defaults.
#
# Usage:
#   docker compose up                    # foreground
#   docker compose up -d                 # detached
#   docker compose logs -f               # follow logs
#   docker compose down                  # stop
#
# Prerequisites:
#   - The model directory at /path/to/kimi-k3/checkpoint, OR
#   - Set K3_MODEL_DIR in .env (copy .env.example)
#
# Cgroups:
#   - Default cpuset: 0-7 (eight cores). Override with CPUSET in .env.
#   - Default memory: 32 GB. Override with MEMORY in .env.

name: kimi-k3-lean

services:
  kimi-k3-lean:
    build:
      context: .
      dockerfile: Dockerfile
    image: kimi-k3-lean:latest
    container_name: kimi-k3-lean
    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 32G
        reservations:
          cpus: "4"
          memory: 16G

    # Bind the model directory as a read-only mount.
    volumes:
      - ${K3_MODEL_DIR:-/path/to/checkpoint}:/data:ro

    # Network. The host can reach the server at 127.0.0.1:8080.
    ports:
      - "${K3_PORT:-8080}:8080"

    # Environment. K3_PRESET picks the engine preset; K3_API_KEY
    # sets the bearer token (required for non-loopback binds).
    environment:
      K3_API_KEY: ${K3_API_KEY:-}

    # Healthcheck: hit /health; if 200, server is ready.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s