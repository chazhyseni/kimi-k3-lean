# litmoe models.yaml for Docker deployment
# Gateway listens on port 8000 internally (exposed to Docker network only).
# Open WebUI on port 8080 externally, connects to gateway at litmoe-gateway:8000.

host: 0.0.0.0
port: 8000
api_key: null

models:
  # Kimi-Linear-48B (48B MoE, 3B active, KDA architecture, 30 GB Q4_K_M)
  # Same architecture as Kimi-K3 but 50x smaller — actually usable on CPU
  - id: kimi-linear-48b
    engine: llamacpp
    model_path: /models/kimi-linear-48b/Q4_K_M/Kimi-Linear-48B-A3B-Instruct.Q4_K_M.gguf
    n_gpu_layers: 0
    n_ctx: 16384

  # DeepSeek-V4-Flash (83 GB IQ1_S, ~150B MoE — loads but 0.33 t/s on CPU)
  # - id: deepseek-v4-flash
  #   engine: llamacpp
  #   model_path: /models/deepseek-v4-flash/UD-IQ1_S/DeepSeek-V4-Flash-0731-UD-IQ1_S-00001-of-00003.gguf
  #   n_gpu_layers: 0
  #   n_ctx: 16384