# litmoe models.yaml for Docker deployment
# Gateway listens on port 8000 internally (exposed to Docker network only).
# Open WebUI on port 8080 externally, connects to gateway at litmoe-gateway:8000.

host: 0.0.0.0
port: 8000
api_key: null

models:
  # DeepSeek-V4-Flash (83 GB IQ1_S, 96 GB RAM)
  - id: deepseek-v4-flash
    engine: llamacpp
    model_path: /models/deepseek-v4-flash/UD-IQ1_S/DeepSeek-V4-Flash-0731-UD-IQ1_S-00001-of-00003.gguf
    n_gpu_layers: 0
    n_ctx: 16384

  # MiniMax-M3 (128 GB IQ1_M, 128 GB RAM)
