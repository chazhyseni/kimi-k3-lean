name: release

# Build per-OS release artifacts and attach them to a GitHub Release.
# Triggered on tag push (v*) or manually.
#
# What this produces:
#   kimi-k3-lean-v0.6.8-linux-x86_64.tar.gz     (Linux glibc, shared lib)
#   kimi-k3-lean-v0.6.8-macos-arm64.tar.gz      (Apple Silicon)
#   kimi-k3-lean-v0.6.8-macos-x86_64.tar.gz     (Intel macOS, Rosetta-compatible)
#   kimi-k3-lean-v0.6.8-windows-x86_64.zip       (Windows, MSVC)
#
# Each archive includes:
#   bin/k3           CLI binary
#   lib/libk3.so     shared library (Python server uses via ctypes)
#   include/libk3/   public C headers
#   README.md, COMBINED.md, INSTALL.md, LICENSE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to build (e.g. v0.6.8)"
        required: true
        default: "v0.6.8"

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------- build-artifact
  build:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            archive: tar
            lib_glob: "lib/libk3.so* lib/libk3_static.*"
          - os: macos
            arch: arm64
            runner: macos-14
            archive: tar
            lib_glob: "lib/libk3*.dylib"
          - os: macos
            arch: x86_64
            runner: macos-13
            archive: tar
            lib_glob: "lib/libk3*.dylib"
          - os: windows
            arch: x86_64
            runner: windows-2022
            archive: zip
            lib_glob: "bin/k3.dll lib/k3_static.lib"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          # Strip leading 'v' if present.
          VERSION_NUM="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_num=$VERSION_NUM" >> "$GITHUB_OUTPUT"
          echo "Build version: $VERSION_NUM"

      - name: Install Linux deps
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install MSVC (Windows)
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # -------------------------------------------------------------- build
      - name: Build with Makefile (POSIX)
        if: matrix.os != 'windows'
        run: |
          export LDFLAGS="-lm -pthread"
          make -j$(nproc) clean
          make -j$(nproc) PREFIX="$RUNNER_TEMP/stage"

      - name: Build with CMake (Windows)
        if: matrix.os == 'windows'
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          # Manually stage the Windows layout (cmake --install works too).
          mkdir -p "$RUNNER_TEMP/stage/bin"
          mkdir -p "$RUNNER_TEMP/stage/lib"
          mkdir -p "$RUNNER_TEMP/stage/include/libk3"
          cp build/bin/Release/k3.exe "$RUNNER_TEMP/stage/bin/"
          cp build/bin/Release/k3.dll "$RUNNER_TEMP/stage/bin/" 2>/dev/null || true
          cp build/lib/Release/k3_static.lib "$RUNNER_TEMP/stage/lib/" 2>/dev/null || true
          cp include/libk3/libk3.h "$RUNNER_TEMP/stage/include/libk3/"

      # -------------------------------------------------------------- bundle docs + license
      - name: Add docs to stage (POSIX)
        if: matrix.os != 'windows'
        run: |
          mkdir -p "$RUNNER_TEMP/stage/share/doc/kimi-k3-lean"
          cp README.md COMBINED.md OPTION_C_HANDOFF.md COMPARISON.md \
             "$RUNNER_TEMP/stage/share/doc/kimi-k3-lean/"
          cp LICENSE "$RUNNER_TEMP/stage/share/doc/kimi-k3-lean/"
          cp install.sh "$RUNNER_TEMP/stage/"

      - name: Add docs to stage (Windows)
        if: matrix.os == 'windows'
        run: |
          mkdir -p "$RUNNER_TEMP/stage/share/doc/kimi-k3-lean"
          cp README.md COMBINED.md OPTION_C_HANDOFF.md COMPARISON.md \
             "$RUNNER_TEMP/stage/share/doc/kimi-k3-lean/"
          cp LICENSE "$RUNNER_TEMP/stage/share/doc/kimi-k3-lean/"
          cp install.ps1 "$RUNNER_TEMP/stage/"

      # -------------------------------------------------------------- archive
      - name: Archive (tar.gz)
        if: matrix.archive == 'tar'
        run: |
          cd "$RUNNER_TEMP"
          ARTIFACT="kimi-k3-lean-${{ steps.v.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"
          # macOS tar on Apple Silicon may be bsdtar; both handle gz fine.
          tar -czf "$ARTIFACT.tar.gz" stage/
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$ARTIFACT.tar.gz" "$GITHUB_WORKSPACE/artifacts/"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        run: |
          cd "$RUNNER_TEMP"
          # Use PowerShell Compress-Archive for Windows-friendly zip.
          ARTIFACT="kimi-k3-lean-${{ steps.v.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"
          powershell -Command "Compress-Archive -Path 'stage/*' -DestinationPath '${ARTIFACT}.zip' -Force"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "${ARTIFACT}.zip" "$GITHUB_WORKSPACE/artifacts/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kimi-k3-lean-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/*

  # -------------------------------------------------------------- publish release
  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Show what we got
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "kimi-k3-lean ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/**/*
          fail_on_unmatched_files: false